// ─── ピンチズーム ───
// Macのトラックパッドのピンチは ctrlKey 付きの wheel、Safariは gesture* として
// 飛んでくる。プレビュー環境によってはブラウザ標準のズームが効かないので、
// ここで拾って中身全体を CSS zoom で拡大縮小する。
const ZOOM_MIN = 0.25;
const ZOOM_MAX = 3;

function useZoom() {
  const [zoom, setZoom] = React.useState(1);
  const zRef = React.useRef(1);
  const applyRef = React.useRef(() => {});

  React.useEffect(() => {
    // ズーム前後で、カーソル(ピンチ中心)の下にある内容が動かないようスクロールを補正する。
    const apply = (next, cx, cy) => {
      const prev = zRef.current;
      const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
      if (z === prev) return;
      const ratio = z / prev;
      const se = document.scrollingElement || document.documentElement;
      const nx = (se.scrollLeft + cx) * ratio - cx;
      const ny = (se.scrollTop + cy) * ratio - cy;
      zRef.current = z;
      setZoom(z);
      requestAnimationFrame(() => { se.scrollLeft = nx; se.scrollTop = ny; });
    };
    applyRef.current = apply;

    const onWheel = (e) => {
      if (!e.ctrlKey && !e.metaKey) return; // 通常のスクロールはそのまま
      e.preventDefault();
      apply(zRef.current * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    };

    // Safari: gesture* が e.scale を直接くれる (ctrl+wheel より滑らか)
    let gBase = 1, gx = 0, gy = 0;
    const onGestureStart = (e) => {
      e.preventDefault();
      gBase = zRef.current; gx = e.clientX; gy = e.clientY;
    };
    const onGestureChange = (e) => { e.preventDefault(); apply(gBase * e.scale, gx, gy); };
    const onGestureEnd = (e) => { e.preventDefault(); };

    const onKey = (e) => {
      if (!e.metaKey && !e.ctrlKey) return;
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      if (e.key === '+' || e.key === '=' || e.key === ';') { e.preventDefault(); apply(zRef.current * 1.1, cx, cy); }
      else if (e.key === '-') { e.preventDefault(); apply(zRef.current / 1.1, cx, cy); }
      else if (e.key === '0') { e.preventDefault(); apply(1, cx, cy); }
    };

    window.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('gesturestart', onGestureStart, { passive: false });
    window.addEventListener('gesturechange', onGestureChange, { passive: false });
    window.addEventListener('gestureend', onGestureEnd, { passive: false });
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('wheel', onWheel);
      window.removeEventListener('gesturestart', onGestureStart);
      window.removeEventListener('gesturechange', onGestureChange);
      window.removeEventListener('gestureend', onGestureEnd);
      window.removeEventListener('keydown', onKey);
    };
  }, []);

  const step = (mul) => applyRef.current(mul === 0 ? 1 : zRef.current * mul, window.innerWidth / 2, window.innerHeight / 2);
  return [zoom, step];
}

function ZoomHUD({ zoom, step }) {
  const btn = {
    width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
    border: 0, background: 'transparent', color: '#2a251f', fontSize: 16, cursor: 'pointer',
    borderRadius: 6, lineHeight: 1,
  };
  return (
    <div style={{
      position: 'fixed', right: 16, bottom: 16, zIndex: 9999,
      display: 'flex', alignItems: 'center', gap: 2, padding: 4,
      background: 'rgba(255,255,255,0.92)', border: '1px solid #d9d5cc', borderRadius: 10,
      boxShadow: '0 2px 10px rgba(0,0,0,.12)', backdropFilter: 'blur(6px)',
      fontFamily: '-apple-system, system-ui, sans-serif',
    }}>
      <button style={btn} onClick={() => step(1 / 1.2)} title="縮小 (⌘−)">−</button>
      <button
        style={{ ...btn, width: 52, fontSize: 12, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}
        onClick={() => step(0)} title="100%に戻す (⌘0)"
      >{Math.round(zoom * 100)}%</button>
      <button style={btn} onClick={() => step(1.2)} title="拡大 (⌘+)">＋</button>
    </div>
  );
}

}
